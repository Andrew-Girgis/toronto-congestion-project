institutional:
  city_toll_power:
    value: prohibited
    source_id: [D-009, D-010]
    label: OBSERVED
    notes: >
      Since 2025-06-05 the City of Toronto Act s.41 bars the City from tolling highways for any purpose,
      including congestion, and s.116 (the regulation route) is repealed. A City cordon charge would need
      an Act of the Legislature, not just a regulation. Whether a cordon fee on streets is a 'toll highway'
      is a legal question (UNVERIFIED).
  provincial_highway_tolls:
    value: prohibited unless authorized by an Act
    source_id: D-011
    label: OBSERVED
  gardiner_dvp_owner:
