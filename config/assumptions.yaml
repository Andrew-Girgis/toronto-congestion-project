# Assumptions for the aggregate behaviour + financial model (drafted by workstream D, 2026-10-24; adopted with a calibration block).
# Each entry: value / low / high / units / source_id (research/sources_D.csv) / label / notes.
# Labels: OBSERVED | OBSERVED (REPORT) | ESTIMATED | ASSUMPTION | UNVERIFIED.
# Low/high are illustrative scenario bounds, NOT confidence intervals.
# Our calculations are marked calc: true.

meta:
  currency: CAD
  price_base_year: 2025
  real_terms: true
  horizon_years: 10
  drafted: 2026-10-24

