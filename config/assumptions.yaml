auto_operating_cost:
  perceived_per_km_2025:
    value: 0.22
    low: 0.14
    high: 0.22
    units: CAD 2025 per vehicle-km
    source_id: [D-004, D-002]
    label: ESTIMATED
    calc: true
    notes: >
      Metrolinx fuel 0.12 + maintenance 0.05 + tires 0.02 (2021$) x 1.1564. Low = fuel only.
      Do NOT use the CRA allowance rate (D-027); it includes fixed costs.
  cordon_trip_length_km:
    value: 20
    low: 12
    high: 30
    units: km one-way
    source_id: null
    label: ASSUMPTION
    notes: Stockholm 17 km, Gothenburg 15 km (D-006). Toronto value needs TTS (restricted) or SUMO path lengths.
  daily_parking_cost_paid:
    value: 15
    low: 0
    high: 25
    units: CAD per day for drivers who pay parking
    source_id: null
    label: ASSUMPTION
    notes: >
      Very influential: the larger the existing out-of-pocket cost, the smaller the response to a fixed
      charge. The share of drivers with free or employer-paid parking is unknown (UNVERIFIED).

behaviour:
  model_form: >
    log-arc demand response on perceived money cost per cordon-crossing trip:
    D1 = D0 * ((c0 + charge) / c0) ** elasticity, where c0 = operating cost (+ parking where paid).
    This is the form used by Börjesson (D-006). Apply it to non-exempt traffic only.
  elasticity_total_cost_intro:
    value: -0.5
    low: -0.3
    high: -0.87
    units: log-arc elasticity wrt total trip money cost, at introduction
    source_id: [D-006, D-005]
    label: ASSUMPTION (bounded by OBSERVED (REPORT))
    notes: >
      Observed at introduction: Stockholm -0.87, Gothenburg -0.69 (total traffic, charged hours);
      peak only -0.67 / -0.53. US toll roads -0.30 to -0.36 (Janson & Levinson, cited in D-006).
      Base -0.5 is a judgement: Toronto has a lower transit share than Stockholm (~75% peak) and
      Gothenburg's lower-transit context gave smaller values. Calibrate so S2 lands inside the observed
      10–25% band or explain why not.
  elasticity_peak_multiplier:
    value: 0.77
    source_id: D-006
    label: ESTIMATED
    calc: true
    notes: Stockholm peak/total at intro = -0.67/-0.87.
  elasticity_long_run_drift_per_year:
    value: 0.0
    low: -0.02
    high: 0.04
    units: change in elasticity magnitude per year
    source_id: D-006
    label: ASSUMPTION
    notes: Stockholm rose (-0.87 to -1.24 over 8 years); Gothenburg fell (-0.69 to -0.52). Direction is not transferable.
  elasticity_rate_increase:
    value: -0.28
    low: -0.16
    high: -0.28
    units: peak elasticity when an existing charge is raised
    source_id: D-006
    label: OBSERVED (REPORT)
    notes: Use for later rate rises. They are much less effective than the first introduction.
  vehicle_class_sensitivity:
    trucks_rel_to_private: {value: 0.4, label: ASSUMPTION, source_id: D-006, notes: "Stockholm 2016 rise: trucks -0.25 vs private -0.57 (peak)"}
    company_cars: {value: 0.0, label: ASSUMPTION, source_id: D-006, notes: "Charge often reimbursed; little or no response"}
    ride_hail_ptc: {value: 0.1, label: ASSUMPTION, notes: "Per-trip passenger fee in NYC; Toronto PTC response unknown"}
  response_composition_of_removed_trips:
    notes: >
      Shares of trips that STOP crossing the cordon. 'continue and pay' is the remainder (D1).
      Reroute is simulated in SUMO, not taken from these shares, when the network covers the alternative.
    switch_to_transit:   {value: 0.45, low: 0.40, high: 0.60, source_id: [D-007, D-005], label: OBSERVED (REPORT) range, notes: "London 50–60%; Stockholm ~43% (work trips to transit). New York cross-check (N-001, N-003): weekday subway+bus grew ~317k/day above their 2024 trend in 2025 against ~62k fewer zone entries/day; return-to-office growth is mixed in, so NYC is consistent with the high end but cannot pin the share."}
    reroute_around_zone: {value: 0.15, low: 0.09, high: 0.30, source_id: [D-007, D-005], label: OBSERVED (REPORT) range, notes: "London 20–30% (through trips); Stockholm ~9%. Toronto has a grid with many alternatives (UF-001): test in SUMO."}
    change_destination_or_cancel_combine: {value: 0.25, low: 0.15, high: 0.26, source_id: [D-005, D-007], label: OBSERVED (REPORT) range}
    retime_outside_charged_hours: {value: 0.05, low: 0.0, high: 0.15, source_id: [D-006, D-023], label: ASSUMPTION, notes: "Stockholm: no aggregate sign of retiming; Singapore ALS: strong shoulder surge. Depends on design (S3 tests this)."}
    professional_traffic_unspecified: {value: 0.10, low: 0.05, high: 0.22, source_id: D-005, label: OBSERVED (REPORT), notes: "Stockholm ~5pp of ~23pp"}
    check: shares in each column should sum to ~1.0 after normalisation

time_of_day:
  shoulder_bunching_risk:
    value: qualitative
    source_id: [D-023, D-024]
    label: OBSERVED (REPORT)
    notes: >
      Singapore ALS needed hours extended to 10:15 because of the post-9:30 surge; shoulder pricing from 1994.
      Stockholm found no aggregate departure-time shift. Toronto S3 (shoulder half-rate) is an ASSUMPTION test.
  am_vs_pm_response:
    value: {am_peak: -0.18, pm_peak: -0.23, midday: -0.22}
    units: cordon traffic change, Stockholm 2006
    source_id: D-005
    label: OBSERVED (REPORT)

