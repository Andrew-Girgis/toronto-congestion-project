# --- Added by the model build (main thread) ---------------------------------
calibration:
  observed_band_at_reference_price:
    notes: >
      Toronto's response is CALIBRATED, not estimated: at the reference price (NYC US$9 peak in
      2025 CAD) the share of cordon crossings removed (all responses incl. rerouting) is set to the
      observed international band. The constant-elasticity curve D1 = D0 ((c0+p)/c0)^e is then
      used only to move along prices (S1 $3, S3 shoulder, $5-$20 sweep), with c0 solved per case.
      Direct transfer of Stockholm's -0.87 on Toronto money costs gives ~50-70% drops, which no
      modern scheme has observed (research/parameters.md).
    reference_price_cad: {value: 12.58, source_id: [D-001, D-019], label: ESTIMATED}
    crossing_reduction_at_reference:
      value: 0.11
      low: 0.08
      high: 0.22
      units: share of chargeable crossings, first year
      source_id: [B-NYC-007, B-NYC-008, N-002, B-STO-001]
      label: ASSUMPTION (anchored to OBSERVED (REPORT))
      notes: >
        New York is the primary analogue (user decision 2026-10-24): same charge level (US$9 =
        C$12.58), same era and technology, North American commuting. Base = NYC entries about -11%
        (MTA-reported; UNVERIFIED primary PDF); low = -8% (lower end of reported NYC range, CBC);
        high = Stockholm trial -22% as the cross-check. MTA open data on zone vehicle-miles,
        2025 vs 2024: -3.8% (GPS) to -11.0% (connected vehicles) (N-002), consistent with the band.
    elasticity_for_price_curve:
      value: -0.5
      source_id: [D-006]
      label: ASSUMPTION
      notes: Shape parameter only; level comes from the calibration target.

transit_response:
  notes: New transit trips = removed vehicles x behaviour.response_composition_of_removed_trips.switch_to_transit (normalised) x vehicle_occupancy_auto x trips per entry.
  go_share_of_new_transit_trips:
    value: 0.35
    low: 0.20
    high: 0.50
    source_id: [D-008]
    label: ASSUMPTION
    notes: >
      Drivers from outside Toronto most likely shift to GO. EX8.14 assumed Toronto residents are
      about 65% of Gardiner/DVP traffic (Table 6), so ~35% non-residents. Not cordon-specific.
  ttc_average_fare_cad: {value: 2.44, label: OBSERVED (REPORT), source_id: T-001, notes: "TTC average fare per revenue ride (Budget Update, Sept 2025, p.17)"}
  go_average_fare_cad: {value: 7.27, label: ESTIMATED, source_id: M-001, notes: "Metrolinx 2023-24 fare revenue $429.2M / 59.0M rides (p.47); fares go to Metrolinx (provincial), not the City"}
  one_way_trips_per_removed_entry: {value: 2, label: ASSUMPTION, notes: "Inbound trip plus the return journey"}

design:
  charging_days_per_year: {value: 250, label: ASSUMPTION, notes: "Weekdays excluding statutory holidays"}
  charging_window: {value: "weekdays 06:00-19:00", label: ASSUMPTION, notes: "SUMO simulates 06:00-10:00; the rest of the day is expanded"}
  am_window_share_of_charged_day_entries:
    value: 0.276
    low: 0.251
    high: 0.33
    label: ESTIMATED (from OBSERVED City counts)
    source_id: tor_tmc
    notes: >
      Pooled share of 06:00-19:00 vehicles counted 06:00-10:00 across 652 fourteen-hour City TMC
      counts in the study area (weekdays since 2023, excluding Jul/Aug/Dec); median 0.272, IQR
      0.251-0.289. All directions, not inbound only: AM inbound is likely more peaked, so the
      pessimistic bound is raised to 0.33 (ASSUMPTION). Higher share = fewer daily entries = less revenue.
  repeat_entry_share_once_per_day:
    value: 0.15
    low: 0.08
    high: 0.23
    label: ASSUMPTION
    notes: Under a once-per-day charge, repeat entries pay nothing extra. Singapore ALS ~23% repeat entries (Phang & Toh 2004; research B).
  exempt_or_discounted_share:
    value: 0.08
    low: 0.04
    high: 0.15
    label: ASSUMPTION
    notes: Transit/emergency/disability-permit vehicles and low-income discount uptake. NYC/London exemption lists in research/cases.
  ptc_per_trip_fee_cad:
    value: 2.10
    low: 1.05
    high: 2.10
    label: ASSUMPTION
    notes: NYC HVFHV US$1.50 x 1.3978; ride-hail pays per trip instead of the daily car charge.
  truck_rate_multiplier:
    value: 1.6
    label: ASSUMPTION
    notes: NYC small trucks US$14.40 vs cars US$9 (D-019).
  heavy_vehicle_share_of_crossings:
    value: 0.04
    label: ASSUMPTION
    notes: To be replaced by TMC truck share at boundary crossings.

finance:
  ramp_up_year1_collection_factor: {value: 0.9, label: ASSUMPTION, notes: "Enforcement and account set-up in year one"}
  opex_share_by_year: {value: [0.30, 0.22, 0.17, 0.15, 0.13, 0.12, 0.12, 0.11, 0.11, 0.11], label: ASSUMPTION, source_id: [D-006, D-020], notes: "Stockholm 31% -> 7%; 407 ETR 13-16%; start high, mature lower"}
  implementation_years_before_launch: {value: 2, label: ASSUMPTION, notes: "Legislation, procurement, build; Stockholm ~3 yrs, NYC much longer due to litigation"}
  transit_service_share_of_net: {value: 0.6, label: ASSUMPTION (policy choice), notes: "User-adjustable allocation; London/NYC/Stockholm earmarked to transport"}
  equity_mitigation_share_of_net: {value: 0.15, label: ASSUMPTION (policy choice)}

assignment:
  # Static user-equilibrium assignment (AequilibraE, BPR, bi-conjugate Frank-Wolfe), one per hour.
  # Replaced SUMO mesoscopic runs for street-level results: those deadlocked at expressway-ramp
  # junctions of the OSM-built network even at half demand (see docs/validation.md).
  capacity_veh_per_lane_hour:
    value: {motorway: 1800, motorway_link: 1300, primary: 800, primary_link: 800, secondary: 700,
            secondary_link: 700, tertiary: 600, tertiary_link: 600, unclassified: 450,
            residential: 450, living_street: 300}
    label: ASSUMPTION
    source_id: null
    notes: >
      Planning-level values: ~1,800 veh/h/lane saturation flow times a typical downtown green
      share (~0.4-0.45) for signalised arterials; uninterrupted flow for expressways. Not
      calibrated to Toronto signal timings, which the open data does not provide.
  bpr_alpha: {value: 0.15, label: ASSUMPTION, source_id: null, notes: "Standard BPR (US BPR 1964)"}
  bpr_beta: {value: 4, label: ASSUMPTION, source_id: null, notes: "Standard BPR"}
  signal_delay_min:
    value: 0.25
    label: ASSUMPTION
    source_id: null
    notes: Fixed free-flow delay added to links ending at a signalised junction (~15 s average).
  rgap_target: {value: 0.001, label: ASSUMPTION, source_id: null, notes: "Convergence: relative gap"}
  max_iter: {value: 100, label: ASSUMPTION, source_id: null, notes: "Iteration cap"}

pilot:
  cost_cad:
    value: 66750
    low: 52000
    high: 81500
    units: CAD, 90-day pilot, staff time + hosting
    label: ASSUMPTION
    source_id: adoption/cost.md
    notes: Sum of the line items in adoption/cost.md (each an ASSUMPTION); shown rounded as about C$50k-80k.
